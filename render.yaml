# Render Blueprint for the StudyMe server (backend/). In Render: New → Blueprint → this repository.
# Secrets are marked `sync: false`: Render asks for them once and never reads them from this file.
# The database (Supabase) and file storage (Cloudflare R2) must be in or near the same region.
services:
  - type: web
    name: studyme-api
    runtime: node
    rootDir: backend
    region: singapore
    plan: starter # the free plan sleeps after 15 minutes idle; sync and AI apps would wait 30s+ to wake it
    # --include=dev: NODE_ENV=production would make npm skip dev packages, and drizzle-kit (dev, but
    # also an optional peer of a runtime package) then fails to install. Installing all of them works.
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true # every push to main goes live
    envVars:
      - key: NODE_ENV
        value: production
      # The server's public address, e.g. https://api.studyme.app (also where Google sends people back).
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      # Supabase → Connect → Session pooler.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        value: ./certs/supabase-ca.crt
      # The web app's address(es), comma-separated, e.g. https://studyme.app
      - key: CORS_ORIGINS
        sync: false
      - key: APP_SCHEME
        value: studyme
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
